<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" fill="#030a12"/>
  <rect x="8" y="8" width="176" height="176" fill="none" stroke="#0d2a45" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="0" y1="96" x2="192" y2="96" stroke="#0d2a45" stroke-width="0.5"/>
  <line x1="96" y1="0" x2="96" y2="192" stroke="#0d2a45" stroke-width="0.5"/>
  <!-- Outer ring -->
  <circle cx="96" cy="96" r="70" fill="none" stroke="#0d2a45" stroke-width="1"/>
  <circle cx="96" cy="96" r="70" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="30 10" opacity="0.6"/>
  <!-- Inner ring -->
  <circle cx="96" cy="96" r="50" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
  <!-- Diamond/octagon shape -->
  <polygon points="96,30 140,60 155,96 140,132 96,162 52,132 37,96 52,60" fill="#0a1828" stroke="#00e5ff" stroke-width="1.5"/>
  <!-- Corner clips -->
  <polygon points="96,38 134,63 148,96 134,129 96,154 58,129 44,96 58,63" fill="#060f1c" stroke="#1a4060" stroke-width="1"/>
  <!-- Center symbol ◈ -->
  <text x="96" y="115" text-anchor="middle" font-family="Arial" font-size="58" font-weight="900" fill="#00e5ff" opacity="0.9">◈</text>
  <!-- Glow effect -->
  <text x="96" y="115" text-anchor="middle" font-family="Arial" font-size="58" font-weight="900" fill="#00e5ff" opacity="0.15" filter="url(#glow)">◈</text>
  <!-- Corner marks -->
  <line x1="20" y1="20" x2="34" y2="20" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="20" y1="20" x2="20" y2="34" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="172" y1="20" x2="158" y2="20" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="172" y1="20" x2="172" y2="34" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="20" y1="172" x2="34" y2="172" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="20" y1="172" x2="20" y2="158" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="172" y1="172" x2="158" y2="172" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="172" y1="172" x2="172" y2="158" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  <!-- Top label -->
  <text x="96" y="18" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#00e5ff" letter-spacing="3" opacity="0.6">NEXUSOS</text>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
</svg>
